[project]
name = "uam-serving"
version = "0.1.0"
description = "우리 아이 미술관 모델 서빙 — 워커·어댑터·model-api 내부 경로·llm-server (담당 A)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn==0.30.6",
  "PyMySQL==1.1.1",
  "structlog==24.4.0",
  "pillow==10.4.0",
  "pillow-heif==0.18.0",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "httpx==0.27.2"]
# 실제 모델(M1·M2·M5). 가짜 어댑터(UAM_FAKE_MODELS=1)만 쓸 때는 설치하지 않는다
models = [
  "torch==2.4.1",
  "torchvision==0.19.1",
  "transformers==4.44.2",
  "open_clip_torch==2.26.1",
  "timm==1.0.9",
  "kornia==0.7.3",
  "einops==0.8.0",
  "imageio-ffmpeg==0.6.0",   # 고정된 정적 ffmpeg(M3 GIF→MP4). 호스트 Homebrew ffmpeg에 기대지 않는다
  "scipy==1.16.2",           # M1 구멍 채우기(D56) · M3 렌더 모양 검사(D55) — ndimage
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
