# 설명 규칙 검사 기준표(U11) — 규칙 값의 정본은 이 파일 하나다(research R-26, REF D29).
# 지금은 **임시 기준표**다. 확정 값은 평가 묶음 설명 입력(T118 caption_input) 측정 뒤 docs/C_설명규칙검사.md에서 정하고,
# 이 파일을 바꾼 뒤 llm-server를 재시작해 반영한다(규칙은 기동 때 한 번 읽는다). 교체하면 research R-26 교체 기록표에 한 줄.
version: tmp-2026-09-30
provisional: true

# 자동 재생성 상한(BR-CAP-02 [추론 U11]) — 첫 생성 포함 총 max_regen + 1회. 모두 걸리면 템플릿(llm_to_template)
max_regen: 2

# 형식 검사(→ fail_event). SD_03 분류는 event·emotion·development 3종뿐이라 형식 불량을 사건으로 센다 [추론]
format:
  max_chars: 300
  banned_marks: ["<think>", "</think>"]

# 지어낸 아이 말(→ fail_event): 입력에 words가 없는데 아래 표현이 있으면 걸린다
quote_markers: ["말했", "라고 했", "이라고 했", "하고 말", "얘기했", "이야기했"]

# 금지어 사전 + 입력 대조. 위에서부터 차례로 검사하고 처음 걸린 분류 하나를 낸다.
# 어간이 문장에 있고 입력(keywords·tags·words를 이은 글)에는 없으면 걸린다. 입력에 있으면 허용한다.
checks:
  - class: fail_development     # 발달·재능 평가
    stems: ["천재", "재능", "소질", "재주", "영재", "솜씨", "실력", "뛰어나", "뛰어난", "훌륭", "대단", "잘 그렸", "잘그렸",
            "또래보다", "또래에 비해", "발달", "성장했", "창의력", "창의적", "표현력", "예술가", "감각이 좋", "감각이 뛰어"]
  - class: fail_emotion         # 입력에 없는 감정
    stems: ["행복", "기쁘", "기뻐", "기뻤", "슬프", "슬퍼", "슬펐", "신나", "신났", "즐거", "즐겁", "재미있", "재밌",
            "무서", "무섭", "외로", "설레", "뿌듯", "속상", "우울", "화가 나", "화났", "사랑", "좋아하", "그리워", "그리운"]
  - class: fail_event           # 입력에 없는 사건
    stems: ["어제", "오늘", "주말", "지난", "생일", "소풍", "여행", "놀러", "다녀온", "다녀왔", "갔던", "갔어", "갔을",
            "놀이터에서", "유치원에서", "어린이집에서", "학교에서", "크리스마스", "명절", "추석", "설날", "휴가", "캠핑"]

# 템플릿(기준선, llm-contract §3-5). {age}·{words}{obj}는 코드가 채운다. obj = 을/를(마지막 낱말 받침)
template:
  age: "{age}살 때 그린 작품이에요."
  words: "{words}{obj} 그렸어요."
  empty: "아이가 그린 작품이에요."
  joiner: "·"

# 프롬프트(llm-contract §3-1). 2026-09-28 공유 Ollama 실측으로 고른 문구를 그대로 옮김 — 예시 없이는 없는 물건을 지어내고 반말로 끝났다
prompt:
  system: |-
    너는 아이 그림에 붙일 설명을 쓴다. 규칙:
    1. 입력에 있는 낱말과 사실만 쓴다. 입력에 없는 물건·사건·감정·재능 평가는 절대 쓰지 않는다.
    2. 2문장. 모든 문장은 '~이에요', '~했어요', '~그렸어요'처럼 해요체로 끝낸다.
    3. 아이의 말(words)이 있으면 그 뜻만 옮긴다. words가 없으면 '말했어요'를 쓰지 않는다.
  shots:
    - input: {keywords: ["집", "빨간색"], ageAtMaking: 4}
      output: "4살 때 그린 작품이에요. 빨간색으로 집을 그렸어요."
    - input: {keywords: ["강아지"], words: "우리 강아지 산책", ageAtMaking: 6}
      output: "6살 때 그린 강아지 그림이에요. 아이는 강아지와 산책한 것이라고 말했어요."
