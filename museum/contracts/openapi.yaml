          description: 평가 항목(시험 호출 선택용 포함)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EvalItem' }
    post:
      tags: [관리]
      summary: 평가 항목 등록 — 팀원 제작 작품만 (BR-MDL-04, G20)
      security: [{ staffSession: [operator, evaluator] }]
      x-permission: models.manage   # D24 — 역할(보안 범위)은 api/src/auth/policy.ts와 같다
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, expectedPath, makerAttested]
              properties:
                category: { type: string, enum: [person, non_person, capture_condition, sculpture, caption_input] }
                shootingCondition: { type: string, maxLength: 80 }
                expectedPath: { type: string, enum: [animated, relief, frame, sculpture, caption] }
                makerAttested: { type: boolean, const: true, description: 'G20 팀원 제작 확인(SD_03 maker_attested)' }
                photo: { type: string, format: binary }
                inputText: { type: string, description: '설명 입력 세트(category=caption_input일 때만)' }
      responses:
        '201':
          description: 등록됨 — 새 평가 항목 번호
          content:
            application/json:
              schema: { type: object, required: [id], properties: { id: { type: string } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/admin/api-guide/spec:
    get:
      tags: [운영]
      summary: "'API활용' 엔드포인트 탭 원천 — app-api + model-api 명세 4묶음과 활성 버전 대조 (UC11, BR-API-07·08, U17)"
      security: [{ staffSession: [operator, integrator] }]
      x-permission: apiGuide.use   # D24 — 역할(보안 범위)은 api/src/auth/policy.ts와 같다
      responses:
        '200':
          description: 합친 명세와 대조 결과. 모델 명세를 못 읽으면 마지막 확인 명세와 시각
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, enum: [보호자 앱, 운영, 관리, 모델 기능] }
                        spec: { type: object }
                  versionCheck:
                    type: array
                    items:
                      type: object
                      properties:
                        modelId: { type: string }
                        specVersion: { type: [string, 'null'], description: 'model-api 명세 info.x-model-versions 값' }
                        activeVersion: { type: [string, 'null'] }
                        match: { type: boolean }
                  fetchedAt: { type: [string, 'null'], format: date-time, description: '모델 기능 명세를 마지막으로 읽은 시각' }
                  stale: { type: boolean, description: '이번에 model-api를 읽지 못해 마지막 확인 명세를 보여 줌' }
  /v1/admin/api-guide/test-call:
    post:
      tags: [운영]
      summary: 시험 호출 — 평가 묶음 작품만 (EXT3, BR-API-09, G23, D12·D17)
      description: |
        내부 시험 키(`api_key.key_kind='test'`, `npm run ops:key -- issue --kind test`로 발급해 app-api 환경 변수 `API_GUIDE_TEST_KEY`에 둔다)로
        model-api `/v1/models/{function}`을 대신 호출한다. 가족 작품 ID는 받지 않는다. `evalItemId`는 사진이 있는 평가 묶음 항목이어야 한다 —
        없거나 설명 입력 항목이면 422 `not_eval_item`(G23). 시험 키가 설정되지 않았으면 503 `not_saved`/`test_key_missing`. model-api 거절(401·403·413·422·429·503)은 같은 상태와 코드로 전달한다.
      security: [{ staffSession: [operator, integrator] }]
      x-permission: apiGuide.use   # D24 — 역할(보안 범위)은 api/src/auth/policy.ts와 같다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [function, evalItemId]
              properties:
                function: { type: string, enum: [segment, classify, pose, relief] }
                evalItemId: { type: string }
      responses:
        '202':
          description: 외부 작업 등록됨(H15). 상태는 /v1/admin/api-guide/test-call/{jobId}
          content:
            application/json:
              schema: { $ref: 'model-api.openapi.yaml#/components/schemas/ExtJob' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/admin/api-guide/test-call/{jobId}:
    get:
      tags: [운영]
      summary: 시험 호출 상태·결과(H16) — 결과 분류·모델 ID·버전·처리 시간·오류 분류
      security: [{ staffSession: [operator, integrator] }]
      x-permission: apiGuide.use   # D24 — 역할(보안 범위)은 api/src/auth/policy.ts와 같다
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]{0,17}$' } }
      responses:
        '200':
          description: 외부 작업 상태
          content:
            application/json:
              schema: { $ref: 'model-api.openapi.yaml#/components/schemas/ExtJob' }

components:
  securitySchemes:
    guardianSession:
      type: apiKey
      in: cookie
      name: uam_sid
    staffSession:
      type: apiKey
      in: cookie
      name: uam_ops_sid
      description: 역할(operator/evaluator/integrator)은 security scope 목록으로 표기

  parameters:
    ChildId:
      name: childId
      in: path
      required: true
      schema: { type: string, pattern: '^[1-9][0-9]{0,17}$' }
    ArtworkId:
      name: artworkId
      in: path
      required: true
      schema: { type: string, pattern: '^[1-9][0-9]{0,17}$' }
    ModelId:
      name: modelId
      in: path
      required: true
      schema: { type: string, enum: [M1, M2, M3, M4, M5, M6, M7] }

  responses:
    Unauthorized:
      description: 로그인 필요·자격 불일치·세션 무효(재설정 뒤 포함)(BR-ACC-02)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TokenInvalid:
      description: 메일 링크 토큰이 만료·사용·무효 — 구분하지 않음(G27, 결정 ③)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: 요청 한도 초과
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ForbiddenRole:
      description: 역할 없음(G1) — "이 화면을 볼 역할이 없어요"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 없음 또는 다른 가족 자원(존재를 숨김)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 상태 전이 불가·`deleting`·승인된 설명 재생성·롤백 후보 없음 등
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidInput:
      description: 형식 밖·판독 불가(G5) — reason `format` | `unreadable`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: 20MB 초과(G5)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: 필드 검증 실패 — 빈 별칭·미래 제작일·연령 범위·비밀번호 확인 불일치 등
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotSaved:
      description: 저장 실패 — 아무것도 남지 않음("접수되지 않았어요"/"저장되지 않았어요")
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum: [unauthorized, forbidden_role, not_found, conflict, invalid_input, payload_too_large, validation_failed, not_saved, llm_unavailable, token_invalid, email_unverified, rate_limited]
        reason:
          type: string
          description: 세부 사유 코드 = gate_event.reason_code (예 format, unreadable, no_family, already_in_family, invite_owner_only, co_guardian_full, invite_email_mismatch, story_conflict, m6_preload_at_start_only, made_on_in_future, age_out_of_range, deleting, already_processing, caption_locked, no_rollback_candidate, license_unconfirmed, eval_incomplete, check_in_progress, not_check_sample, no_check_sample, version_retired, rule_not_checked, m6_check_p05, check_runner_missing)
        gate: { type: string, description: 'SD_01 게이트 번호(예 G4). 화면 C2 차단 블록용', pattern: '^G[0-9]{1,2}$' }
        detail:
          type: string
          description: 사람이 읽는 안내 한 문장(RFC 9457 detail) — 무엇이 틀렸고 부르는 쪽이 무엇을 하면 되는지. 화면 문구로 쓰지 않는다
        fields:
          type: array
          items:
            type: object
            required: [name, reason]
            properties:
              name: { type: string, description: 틀린 칸 이름(경로·쿼리·본문) }
              reason: { type: string, description: 'required · unrecognized · not_positive_integer · not_in_enum · not_date · invalid_type · too_small · too_big · invalid_string · invalid_enum_value · blank · too_long …' }
              message: { type: string, description: 이 칸에 넣어야 할 올바른 값 안내(형식·길이·범위·허용 값) }
        requestId: { type: string }

    DeletionProgress:
      type: object
      required: [state]
      description: 'S9 삭제 진행(D21). accepted = 접수 직후, waiting_stop = 실행 중 작업 멈춤 대기(G19 보류), deleting_files = 파일 삭제 중, done = 끝남'
      properties:
        state: { type: string, enum: [accepted, waiting_stop, deleting_files, done] }
        gate: { type: [string, 'null'], description: 'waiting_stop이면 G19' }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    StaffRole:
      type: string
      enum: [operator, evaluator, integrator]

    ChildInput:
      type: object
      required: [alias]
      additionalProperties: false
      properties:
        alias: { type: string, minLength: 1, maxLength: 20, description: '별칭만. 실명·생년월일 필드 없음(BR-CHD-01). 앞뒤 공백을 뺀 1~20자, 허용 문자 제한 없음(D22). DB 컬럼 VARCHAR(100)은 여유' }
        character: { $ref: '#/components/schemas/CharacterKind' }
        color: { $ref: '#/components/schemas/CharacterColor' }
        museumStyle: { $ref: '#/components/schemas/MuseumStyle' }
    Child:
      type: object
      required: [id, alias]
      properties:
        id: { type: string, description: '아이 ID — 아이를 구분하는 기준(D18)' }
        alias: { type: string }
        artworkCount: { type: integer, description: v_child_artwork_count }
        aliasDuplicate: { type: boolean, description: '같은 가족에 같은 별칭이 이미 있음 — 저장은 했고 "같은 별칭이 이미 있어요" 안내만(FR-1 v2.2)' }
        character: { oneOf: [{ $ref: '#/components/schemas/CharacterKind' }, { type: 'null' }], description: '캐릭터(D40) — 아직 안 골랐으면 null(화면 기본값)' }
        color: { oneOf: [{ $ref: '#/components/schemas/CharacterColor' }, { type: 'null' }] }
        museumStyle: { oneOf: [{ $ref: '#/components/schemas/MuseumStyle' }, { type: 'null' }] }
    CharacterKind: { type: string, enum: [bear, rabbit, cat, dog, fox, penguin, dino, owl], description: '캐릭터 8종(D40) — 곰·토끼·고양이·강아지·여우·펭귄·공룡·부엉이, 자체 제작 그림' }
    CharacterColor: { type: string, enum: [sunflower, peach, sky, leaf, lavender, cloud], description: '캐릭터 색 6(D40) — 해바라기·복숭아·하늘·풀잎·라벤더·구름' }
    MuseumStyle: { type: string, enum: [glass_pyramid, white_spiral, column_temple, clock_station, brick_chimney, golden_dome, hanok_roof, silver_wave], description: '미술관 모양 8(D40) — 세계 유명 미술관·박물관 모티브(모양만, 이름·로고 없음 D33): 유리 피라미드·하얀 나선 탑·기둥 신전·시계탑 기차역·붉은 벽돌 굴뚝·황금 돔 궁전·기와 한옥·은빛 물결 지붕' }
    TownChild:
      type: object
      required: [id, alias]
      properties:
        id: { type: string, description: '아이 ID — 방문 미술관 주소(/v1/visit/children/{id}/gallery). 내 아이면 내 미술관' }
        alias: { type: string }
        character: { oneOf: [{ $ref: '#/components/schemas/CharacterKind' }, { type: 'null' }] }
        color: { oneOf: [{ $ref: '#/components/schemas/CharacterColor' }, { type: 'null' }] }
        museumStyle: { oneOf: [{ $ref: '#/components/schemas/MuseumStyle' }, { type: 'null' }] }
    TownBuilding:
      type: object
      required: [id, x, y, relation]
      properties:
        id: { type: string, description: '건물 id(서명한 불투명 값, 가족 번호 아님)' }
        x: { type: integer, description: 마을 격자 칸 }
        y: { type: integer }
        relation: { type: string, enum: [mine, neighbor, stranger], description: 'stranger는 문 잠김 — 아래 children 없음' }
        style: { oneOf: [{ $ref: '#/components/schemas/MuseumStyle' }, { type: 'null' }], description: '건물 모양 = 그 가족 첫 아이의 미술관 모양 [추론]' }
        children: { type: array, items: { $ref: '#/components/schemas/TownChild' }, description: 'mine·neighbor만' }
    ArtworkComment:
      type: object
      required: [id, body, createdAt, mine, author]
      description: '(D46 ④) 부모 댓글 — 가족 안에서만'
      properties:
        id: { type: string }
        body: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        mine: { type: boolean }
        author: { type: string, enum: [me, owner, co, gone], description: 'me=나 · owner=만든 보호자 · co=공동 보호자 · gone=지운 계정' }
    VisitGallery:
      type: object
      required: [child, rooms]
      properties:
        child: { $ref: '#/components/schemas/TownChild' }
        rooms:
          type: array
          description: '전시실 1·2… (나이는 싣지 않는다)'
          items:
            type: object
            required: [room, items]
            properties:
              room: { type: integer }
              items:
                type: array
                items:
                  type: object
                  required: [id, kind, title]
                  properties:
                    id: { type: string }
                    kind: { type: string, enum: [animated, relief, frame, sculpture] }
                    title: { type: [string, 'null'] }
                    primaryUrl: { type: [string, 'null'], description: '방문 전용 파일 경로 — frame은 그림 사진(고친 사진 우선), animated·relief·sculpture는 결과 파일' }
                    auxUrl: { type: [string, 'null'], description: 'animated는 그림 사진(포스터) · relief는 오려 낸 그림(시차 앞면) · 그 밖 null' }
                    making: { type: boolean, description: '(D46) 만들기 → 받침대(D45)' }

    ArtworkState:
      type: string
      enum: [received, judging, awaiting_confirm, processing, awaiting_review, failed, approved, exhibited]
      description: 'SD_03 artwork.status + 유도 exhibited(v_artwork_display). failed = 처리하지 못함. deleting 작품은 응답하지 않음(404)'
    Suggestion:
      type: string
      enum: [animated, relief, frame, none]
    ConfirmKind:
      type: string
      enum: [animated, relief, frame, sculpture]
    ResultKind:
      type: string
      enum: [animated, relief, frame, sculpture]
    Decision:
      type: string
      enum: [like, use_lower, frame, retake]
    DowngradePath:
      type: string
      enum: [animated_to_relief, animated_to_frame, relief_to_frame, split_fail, sculpture_to_relief]
      description: 'SD_03 stage_job.downgrade_cause (llm_to_template는 설명 쪽)'
    Stage:
      type: string
      description: SD_03 stage_job.stage_kind
      enum: [split, judge, animate_render, depth_relief, frame_compose, caption, sculpture]
    StageStatus:
      type: string
      description: 화면 배지(C4) — 대기/진행 중/완료/다시 시도 중/처리하지 못함/취소
      enum: [waiting, running, done, retrying, failed, cancelled]

    ArtworkSummary:
      type: object
      required: [id, childId, state, updatedAt]
      properties:
        id: { type: string }
        childId: { type: string }
        state: { $ref: '#/components/schemas/ArtworkState' }
        exhibited: { type: boolean, description: '(D34) 전시에 걸려 있음 — 걸린 채 다시 만드는 중(processing·awaiting_review·failed)에도 true' }
        currentStage: { oneOf: [{ $ref: '#/components/schemas/Stage' }, { type: 'null' }] }
        title: { type: [string, 'null'] }
        thumbnailUrl: { type: [string, 'null'], description: '/v1/files/{token}' }
        updatedAt: { type: string, format: date-time, description: '접수 시각(목록 정렬 기준). 상태 변화 감지에 쓰지 않는다 — 진행은 `state`·상세 폴링으로 본다(D21)' }

    ArtworkDetail:
      type: object
      required: [id, childId, state, choices, stages]
      properties:
        id: { type: string }
        childId: { type: string }
        state: { $ref: '#/components/schemas/ArtworkState' }
        exhibited: { type: boolean, description: '(D34) 전시에 걸려 있음. state는 다시 만드는 중·확인 대기·실패면 그 진행을, 아니면 걸렸을 때 exhibited를 보인다' }
        hungResultKind:
          description: '(D34) 지금 전시에 걸린 결과 종류(처리 상태와 따로). null=안 걸림'
          oneOf: [{ $ref: '#/components/schemas/ResultKind' }, { type: 'null' }]
        queued: { type: boolean, description: '판정 중(대기) 표시용' }
        originalUrl: { type: [string, 'null'] }
        photoUrl: { type: [string, 'null'], description: '(D39) 액자 · 전시 · 저장에 쓰는 사진 — 고쳤으면 고친 사진, 아니면 원본' }
        photoEdited: { type: boolean, description: '(D39 폐기 — 늘 false)' }
        making: { type: boolean, description: '(D46) 만들기(입체 작품) — 올릴 때 고름' }
        locked: { type: boolean, description: '(D46) 올린 작품은 고정 — 늘 true(이야기 · 사진 · 종류를 고칠 수 없다, 삭제만)' }
        cutoutUrl: { type: [string, 'null'] }
        suggestion:
          description: '제안 문구 코드만. 점수·확률·순위 없음(BR-SUG-02). null=제안 전'
          oneOf: [{ $ref: '#/components/schemas/Suggestion' }, { type: 'null' }]
        confirmedKind:
          oneOf: [{ $ref: '#/components/schemas/ConfirmKind' }, { type: 'null' }]
        choices:
          type: array
          description: 현재 상태에서 허용되는 행동(확정 선택지 또는 결정 선택지). 기본 선택 없음(UX2)
          items: { type: string }
        unavailableChoices:
          type: array
          description: '보이되 막아야 하는 선택지와 이유(S3·S5 C3 비활성). 예: 활성 버전이 없는 모델이 필요한 확정 선택지(clarify 2026-09-28, stage-job §2). 노출 설정이 꺼진 3D는 여기에도 싣지 않는다(D10)'
          items:
            type: object
            required: [choice, reason]
            properties:
              choice: { type: string }
              reason: { type: string, enum: [model_disabled, needs_result, original_unreadable] }
        stages:
          type: array
          items:
            type: object
            required: [stage, status]
            properties:
              stage: { $ref: '#/components/schemas/Stage' }
              status: { $ref: '#/components/schemas/StageStatus' }
              attempt: { type: integer, minimum: 0, maximum: 3 }
              downgraded: { type: boolean }
              waitingForModel: { type: boolean, description: '이 단계 모델이 적재 중(hint=model_loading)이라 큐에서 기다림 — 오류 아님. 모델 이름·상태 원문은 싣지 않는다' }
              etaSeconds: { type: [number, 'null'], description: '적재 남은 시간 짐작(있을 때만)' }
        result:
          oneOf:
            - type: 'null'
            - type: object
              required: [kind]
              properties:
                kind: { $ref: '#/components/schemas/ResultKind' }
                primaryUrl: { type: [string, 'null'] }
                auxUrl: { type: [string, 'null'] }
                posterUrl: { type: [string, 'null'] }
        downgrade:
          description: 'UC3·UC4 화면에서만 쓰는 낮춤 표시(BR-FBK-03). 전시 응답에는 없음(D3)'
          oneOf: [{ $ref: '#/components/schemas/DowngradePath' }, { type: 'null' }]
        notDelivered:
          type: object
          description: '상태 failed(처리하지 못함) 안내 — 낮춘 결과가 아님(G9)'
          properties:
            frameAvailable: { type: boolean, description: 원본 읽기 가능 여부 }
        decision:
          oneOf: [{ $ref: '#/components/schemas/Decision' }, { type: 'null' }]
        story: { $ref: '#/components/schemas/Story' }
        caption:
          oneOf: [{ $ref: '#/components/schemas/Caption' }, { type: 'null' }]
        tagCandidates:
          type: array
          description: '(P0.5) 설명 키워드 후보. 판정 근거로 노출 금지'
          items: { type: string }

    Story:
      type: object
      properties:
        updatedAt: { type: [string, 'null'], format: date-time, readOnly: true, description: 'story.updated_at — 동시 수정 판정 기준' }
        title: { type: [string, 'null'], maxLength: 100 }
        titleAuto: { type: boolean, readOnly: true, description: '(D34) 제목이 "제목 없는 그림 N"으로 자동으로 붙음. 보호자가 제목을 고치면 false' }
        madeOnAuto: { type: boolean, readOnly: true, description: '(D46 ⑩) 그린 날을 비워 촬영일 · 올린 날로 채움 — 해설이 날짜를 단정하지 않는다' }
        ageAuto: { type: boolean, readOnly: true, description: '(D46 ⑩) 나이를 비워 최근 나이로 채움 — 해설이 나이를 단정하지 않는다' }
        madeOn: { description: '만든 날. 오늘이나 지난 날짜만 — 미래 날짜는 422 made_on_in_future(G11, 서버·DB 트리거가 막는다)', type: [string, 'null'], format: date }
        ageAtMaking: { type: [integer, 'null'], minimum: 0, maximum: 18 }
        childWords: { type: [string, 'null'], maxLength: 2000 }
        guardianNote: { type: [string, 'null'], maxLength: 1000, description: '보호자 감상평(D25, BR-STY-04) — 선택, 입력 그대로 저장. 전시 조건 아님, AI 설명 입력에 넣지 않음' }
    StoryInput:
      allOf:
        - $ref: '#/components/schemas/Story'
        - type: object
          properties:
            baseUpdatedAt:
              type: [string, 'null']
              format: date-time
              description: '화면이 불러온 이야기의 updatedAt. 저장 시점 값과 다르면 409 story_conflict(공동 보호자 동시 수정, FR-9). 새 이야기면 null'
    StoryUpdatedAt:
      type: object
      properties:
        updatedAt: { type: [string, 'null'], format: date-time }

    CaptionRequest:
      type: object
      required: [keywords, selectedTags]
      additionalProperties: false
      description: '이미지·별칭·제목 필드 없음(BR-CAP-01). 발언·나이·제작일은 서버가 작품에서 채운다'
      properties:
        keywords: { type: array, maxItems: 5, items: { type: string, maxLength: 20 } }
        selectedTags: { type: array, maxItems: 5, items: { type: string } }
        fallback: { type: string, enum: [template, direct], description: 'LLM 소진·M6 비활성 뒤 보호자 선택(E1·E4) 또는 직접 쓰기(A3)' }
        body: { type: string, minLength: 1, maxLength: 1000, description: 'fallback=direct일 때만 필수 — 보호자가 쓴 문장' }
    Caption:
      type: object
      required: [id, source, aiAuthored, state]
      properties:
        id: { type: string }
        body: { type: [string, 'null'] }
        source: { type: string, enum: [llm, template, direct] }
        aiAuthored: { type: boolean }
        edited: { type: boolean }
        state: { type: string, enum: [pending_approval, approved, discarded] }
        generationCount: { type: integer }

    Gallery:
      type: object
      required: [childId, groups]
      properties:
        childId: { type: string }
        groups:
          type: array
          items:
            type: object
            required: [ageAtMaking, items]
            properties:
              ageAtMaking: { type: [integer, 'null'], description: '(D34) null = 나이 미정 묶음(맨 뒤)' }
              items:
                type: array
                items: { $ref: '#/components/schemas/GalleryItem' }
    GalleryItem:
      type: object
      required: [id, kind, title, madeOn, ageAtMaking]
      description: '낮춤·원인·점수 필드 없음(D3, BR-EXH-04)'
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/ResultKind' }
        primaryUrl: { type: [string, 'null'] }
        auxUrl: { type: [string, 'null'] }
        posterUrl: { type: [string, 'null'] }
        originalUrl: { type: string }
        photoUrl: { type: [string, 'null'], description: '(D39) 원본 액자 그림 — 고쳤으면 고친 사진' }
        making: { type: boolean, description: '(D46) 만들기 → 미술관 받침대(D45)' }
        title: { type: string }
        titleAuto: { type: boolean, description: '(D34) 자동 제목 — 화면은 "제목을 붙여 줄까요?"를 조용히 권한다' }
        madeOnAuto: { type: boolean, description: '(D46 ⑩) 자동 그린 날' }
        ageAuto: { type: boolean, description: '(D46 ⑩) 자동 나이' }
        madeOn: { type: string, format: date }
        ageAtMaking: { type: [integer, 'null'], description: '(D34) null = 나이 미정' }
        childWords: { type: [string, 'null'] }
        guardianNote: { type: [string, 'null'], description: '보호자 감상평(D25) — 월 라벨에 한마디와 따로' }
        aiCaption:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                body: { type: string }
                aiAuthored: { type: boolean }
        backsideEstimated: { type: boolean, description: '(P1) "뒷면은 AI가 추정했어요"' }

    ModelReadiness:
      type: string
      description: 'C10 칩 — 준비됨·미준비·비활성(라이선스 확인 전)·비활성(P0.5)·CPU 실행·비노출(P1)·확인 불가'
      enum: [ready, not_ready, inactive_license, inactive_tier, cpu_fallback, hidden, unknown]
    Readiness:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        anyLoading: { type: boolean, description: '모델 적재 중이 하나라도 있음(오류 아님). 공개 응답에도 싣는다' }
        checks:
          type: object
          properties:
            db: { type: boolean }
            queue: { type: boolean }
            storage: { type: boolean }
        models:
          type: array
          items:
            type: object
            properties:
              modelId: { type: string }
              servingGroup: { type: string, enum: [cpu_vision, gpu, llm] }
              state: { $ref: '#/components/schemas/ModelReadiness' }
              activeVersion: { type: [string, 'null'] }
              lastCheck:
                description: '팀원 세션일 때만. 이 모델의 가장 최근 점검(D20). 준비 확인이 점검을 일으키지는 않는다'
                type: [object, 'null']
                properties:
                  status: { type: string, enum: [queued, running, passed, failed] }
                  failReason: { type: [string, 'null'] }
                  finishedAt: { type: [string, 'null'], format: date-time }

    ModelCheck:
      type: object
      description: '모델 점검 기록(D20, SD_03 model_check). 점수·객체 키·출력 파일 없음(BR-OPS-05·06)'
      required: [id, modelId, versionId, versionLabel, evalItemId, status, requestedAt]
      properties:
        id: { type: string }
        modelId: { type: string }
        versionId: { type: string }
        versionLabel: { type: string }
        releaseState: { type: string, enum: [candidate, active, rollback_candidate, retired] }
        evalItemId: { type: string }
        status: { type: string, enum: [queued, running, passed, failed], description: 'passed = 오류 없이 끝나고 출력 형식이 맞음' }
        outcome: { type: [string, 'null'], enum: [ok, quality_below, null], description: '모델이 낸 결과 분류(기록만). quality_below도 통과' }
        failReason: { type: [string, 'null'], enum: [engine_down, timeout, storage, db, model_not_ready, bad_output, null] }
        processingMs: { type: [integer, 'null'], description: '어댑터 실행 시간(적재 시간 제외)' }
        memoryMb: { type: [integer, 'null'] }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    Metrics:
      type: object
      description: '정의와 검증 계획이며 실적 아님. 식별 정보 없음(BR-OPS-04)'
      properties:
        period: { type: object, description: '기간을 주지 않으면 from·to는 null(전체 기간)', properties: { from: { type: [string, 'null'] }, to: { type: [string, 'null'] } } }
        service:
          type: object
          properties:
            firstApprovalRate: { type: [number, 'null'] }
            suggestionModifyRate: { type: [number, 'null'] }
            captionRuleFailRate: { type: [number, 'null'] }
            unreachedCount: { type: integer }
            deletionIncompleteCount: { type: integer }
        causes:
          type: object
          description: 원인 5분류(서로 다른 항목)
          properties:
            guardianChoice: { type: integer }
            modelDowngrade: { type: integer }
            guardianSwitch: { type: integer }
            infraFailure:
              type: object
              additionalProperties: { type: integer }
            unreached: { type: integer }
        models:
          type: array
          items:
            type: object
            properties:
              modelId: { type: string }
              modelVersion: { type: string }
              servingGroup: { type: string }
              attempts: { type: integer }
              downgradeRate: { type: [number, 'null'] }
              p95Ms: { type: [integer, 'null'] }
              retryRate: { type: [number, 'null'] }
        queues:
          type: array
          items:
            type: object
            properties:
              servingGroup: { type: string, enum: [cpu_vision, gpu, llm, external] }
              waiting: { type: integer }
              oldestWaitSeconds: { type: [integer, 'null'] }
        external:
          type: array
          items:
            type: object
            properties:
              function: { type: string }
              calls: { type: integer }
              rejected: { type: integer }
    UnreachedItem:
      type: object
      properties:
        stageJobId: { type: string }
        stage: { $ref: '#/components/schemas/Stage' }
        modelId: { type: string }
        modelVersion: { type: string }
        errorClass: { type: string, enum: [engine_down, timeout, storage, db, model_not_ready] }
        attempt: { type: integer }
        durationMs: { type: [integer, 'null'] }
        finishedAt: { type: string, format: date-time }

    ModelVersionInput:
      type: object
      required: [version, weightsSha256, runtime, imageDigest, configHash, device]
      properties:
        version: { type: string }
        weightsSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        runtime: { type: [string, 'null'], description: 'SD_03 model_version.runtime(NULL 허용) — 조회 때 기록이 없으면 null' }
        imageDigest: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$', description: '실행 환경 다이제스트(research R-03, SD_04 §9-2). 등록 요청에는 값이 있어야 한다(app-api 검사). 조회 때 SD_03 image_digest가 NULL인 버전(M4 규칙 파일 등)은 null' }
        configHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        device: { type: [string, 'null'], enum: [cpu, gpu, null], description: 'SD_03 exec_device. Apple Silicon MPS는 gpu + runtime에 mps 표기. 조회 때 기록이 없으면 null(등록 요청에는 필수)' }
        filePath: { type: [string, 'null'], description: 'SD_03 model_version.model_path(R1·U14, NULL 허용) — 조회 때 기록이 없으면 null' }
        licenseRecord: { type: string }
    ModelVersion:
      allOf:
        - $ref: '#/components/schemas/ModelVersionInput'
        - type: object
          properties:
            id: { type: string }
            licenseConfirmed: { type: boolean }
            releaseState: { type: string, enum: [candidate, active, rollback_candidate, retired] }
            latestEvalRunId: { type: [string, 'null'], description: '이 버전의 가장 최근 평가 기록(evaluation.evaluation_id). S11이 새로 고친 뒤에도 진행·판단·승격을 이어 가게 한다(2026-09-29 이제민). 평가 전이면 null' }
    ModelManifest:
      type: object
      properties:
        modelId: { type: string }
        roleName: { type: string }
        tier: { type: string, enum: [P0, P0.5, P1] }
        servingGroup: { type: string, enum: [cpu_vision, gpu, llm] }
        exposed: { type: boolean }
        versions:
          type: array
          items: { $ref: '#/components/schemas/ModelVersion' }
    EvalItem:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        shootingCondition: { type: [string, 'null'] }
        expectedSuggestion: { type: [string, 'null'] }
        expectedPath: { type: [string, 'null'] }
    EvalRun:
      type: object
      properties:
        id: { type: string }
        versionId: { type: string }
        doneCount: { type: integer }
        incompleteCount: { type: integer }
        itemTotal: { type: integer }
        itemDone: { type: integer }
        verdict: { type: [string, 'null'], enum: [pass, hold, null] }
        rationale: { type: [string, 'null'] }
        eligible: { type: boolean, description: v_promotion_eligibility.eligible }
        results:
          type: array
          items:
            type: object
            properties:
              evalItemId: { type: string }
              status: { type: string, enum: [done, incomplete, timeout] }
              expectedPath: { type: [string, 'null'], description: '이 모델 기준 기대 경로(D57 — M1·M5는 항목 기대 animated를 relief로 본다). actualPath와 같으면 일치' }
              itemExpectedPath: { type: [string, 'null'], description: '평가 항목에 적힌 원래 기대 경로(eval_item.expected_path)' }
              actualPath: { type: [string, 'null'] }
              outcome: { type: [string, 'null'] }
              downgradeReason: { type: [string, 'null'] }
              misclassCode: { type: [string, 'null'] }
              durationMs: { type: [integer, 'null'] }
