openapi: 3.1.0
info:
  title: 우리 아이 미술관 — 앱 API (app-api)
  version: 0.1.0
  contact:
    name: 1팀 우리 아이 미술관 — 팀 슬랙 채널(문의 때 응답 헤더 X-Request-ID 번호를 함께)
  description: |
    보호자 앱·운영·관리 API. Node.js 22 LTS + Express 4 (research R-01, D23).
    모델 기능 엔드포인트(/v1/models/*)는 model-api.openapi.yaml(Python uvicorn)에 있다.
    - 오류는 RFC 9457 Problem Details(application/problem+json) + `code` (research R-10).
    - 보호자 경로는 세션 쿠키 `uam_sid`, 운영 경로는 `uam_ops_sid` (research R-08).
    - 다른 가족의 자원은 404로 존재를 숨긴다(BR-ACC-01).
    - 응답 어디에도 모델 점수·확률·객체 키를 싣지 않는다(BR-SUG-02, BR-PRC-04, BR-PRV-01).
    - 이름·형식은 이 문서로 확정한다(U8 닫음). [추론] 표시는 원천 없음.
    - 보호자 경로 공통 오류(D21, 경로별로 반복해 적지 않음): 세션 없음·만료는 401 `unauthorized`(reason `login_required`·`session_revoked`, gate G0),
      가족이 없는 계정(나가거나 해제됨)은 409 `conflict`·reason `no_family`·gate G0 — 화면은 S1d로 간다. 예외: `/v1/me`·`POST /v1/family`·초대 수락은 가족 없이도 된다.
    - 운영 경로 공통 오류: 세션 없음은 401, 역할 없음은 403 `forbidden_role`·reason `role_missing`·gate G1.
    - 경로·쿼리 입력 공통 오류(2026-09-30, API 서비스 점검표 계약 2·4·5행, 경로별로 반복해 적지 않음): 숫자 id 자리(경로 `childId`·`artworkId`·`inviteId`·`memberId`·`runId`·`captionId`·`checkId`·`jobId`, 쿼리 `child`)는
      1~18자리 양의 정수 문자열이다(`^[1-9][0-9]{0,17}$`). 어기면 — 그리고 필수 쿼리가 없거나, `modelId`가 목록 밖이거나, 날짜 쿼리가 `YYYY-MM-DD`가 아니면 —
      처리 전에 422 `validation_failed`·reason `invalid_param`·`fields: [{name, reason}]`(reason `required`·`not_positive_integer`·`not_in_enum`·`not_date`)로 거절한다.
      이 검사는 로그인 확인(401)·소유·존재 확인(404)보다 먼저다(형식만 보고 자원 존재는 알리지 않는다) — 형식이 맞는 id만 404로 존재를 숨긴다(BR-ACC-01). DB 오류(503)로 번지지 않는다.
    - JSON 본문 공통 오류(2026-09-30, 점검표 계약 2~5행, 경로별로 반복해 적지 않음): 본문이 JSON이 아니면 400 `invalid_input`·reason `bad_json`.
      계약에 없는 칸(칸 이름 오타 포함)·필수 칸 누락·타입·길이·범위·목록 밖 값은 422 `validation_failed`로 거절하고, 어느 칸인지 `fields: [{name, reason}]`로 알린다
      (모르는 칸은 reason `unrecognized`). 본문 검사 실패가 503으로 번지지 않는다. 예외: 이야기 저장(`PUT …/story`)은 임시 저장(D22)이라 모든 칸이 선택이다.
    - 오류 안내(2026-09-30, 점검표 W5·E4·E7): 모든 Problem에 `detail`(한국어 한 문장 — 무엇이 틀렸고 부르는 쪽이 무엇을 하면 되는지)을 싣는다.
      422는 `fields[].message`에 칸마다 올바른 값(형식·길이·범위·허용 값)을 적는다. 4xx는 부르는 쪽이 요청을 고치고, 503은 서버 쪽 문제라 요청을 고치지 않고 다시 시도한다.
      `detail`·`message`는 API를 부르는 사람을 위한 문장이고, 화면 문구는 아래처럼 `reason`·`gate`로 정한다(문장을 화면에 그대로 쓰지 않는다).
    - 요청 번호(2026-09-30, 점검표 L1): 모든 응답에 헤더 `X-Request-ID`를 싣는다. 요청에 `X-Request-ID`(1~128자, 영문·숫자·`.`·`_`·`-`)가 오면 그 값을 그대로 쓰고,
      없거나 형식이 틀리면 서버가 UUID를 만든다. 같은 값이 오류 본문 `requestId`와 서버 로그의 모든 줄에 남는다 — 문의할 때 이 번호를 알려 주면 된다.
    - 상태코드와 누가 고치나(2026-09-30, 점검표 E7):

      | 코드 | 뜻 | 누가 고치나 |
      |---|---|---|
      | 200 · 201 · 202 · 204 | 정상(202는 접수 뒤 처리) | 해당 없음 |
      | 400 | JSON이 아님(`bad_json`) · 링크 토큰 무효(`token_invalid`) | 부르는 쪽 — 본문·링크를 고친다 |
      | 401 | 로그인 필요 | 부르는 쪽 — 로그인한다 |
      | 403 | 권한 없음 | 부르는 쪽 — 권한 있는 계정으로 |
      | 404 | 대상 없음(다른 가족 자원도 404) | 부르는 쪽 — 주소·id 확인 |
      | 409 | 지금 상태에서 불가(`reason` 참고) | 부르는 쪽 — 상태를 확인하고 다시 |
      | 413 | 본문 상한 초과(이미지 20MB) | 부르는 쪽 — 줄여서 |
      | 422 | 입력 값 오류(`fields[].message`에 올바른 값) | 부르는 쪽 — 값을 고쳐서 |
      | 429 | 요청 한도 초과 | 부르는 쪽 — 기다렸다가 |
      | 503 | 서버 쪽 문제(저장·모델·DB) | 우리 팀 — 부르는 쪽은 요청을 고치지 않고 다시 시도 |

      500은 내보내지 않는다 — 예상 못 한 서버 오류도 503 `not_saved`로 감싸고 로그에 `requestId`를 남긴다.
    - 판단보류(2026-09-30, 점검표 E5): 모델이 그림을 확신하지 못하거나 제안을 만들지 못하면 오류가 아니라 정상 흐름이다 — 작품 응답 `suggestion`이 `none`이 되고
      보호자가 S3에서 직접 고른다("제안을 준비하지 못했어요 - 직접 골라 주세요", 행선지 = 보호자). 결과 품질이 기준에 못 미치면 결과는 낮춘 경로(액자 등)로 가고
      보호자가 결과 확인에서 다시 고른다. 점수·확률은 응답에 싣지 않는다(BR-SUG-02). 판단보류 건수는 운영 지표(`/v1/admin/metrics` 제안 수정률)로 본다.
    - 오류→화면 사상은 `code`가 아니라 `reason`(+`gate`)으로 한다. 해제 주체·다음 행동 문구는 화면 문구 사전(web `copy/ko.ts`)이 gate·reason으로 정한다.
servers:
  - url: /
tags:
  - name: 보호자 앱
  - name: 운영
  - name: 관리
  - name: 인증

paths:
  /v1/auth/providers:
    get:
      tags: [인증]
      summary: 쓸 수 있는 로그인 수단 (2026-09-30 카카오 로그인, R-26) — 화면이 버튼 활성·비활성을 정한다
      security: []
      responses:
        '200':
          description: 로그인 수단
          content:
            application/json:
              schema:
                type: object
                required: [kakao, emailSignup]
                properties:
                  kakao: { type: boolean, description: 서버에 카카오 앱 키가 설정돼 있는가 }
                  emailSignup: { type: boolean, description: 새 이메일 가입을 화면에 보일지(메일 발송이 켜져 있을 때만 true — 팀 결정 전) }
  /v1/auth/kakao/start:
    get:
      tags: [인증]
      summary: 카카오 로그인 시작 (UC13 §0, R-26) — state 쿠키를 두고 카카오 인증 화면으로 302
      description: 브라우저가 이 주소로 이동한다(fetch 아님). 받는 값은 회원번호뿐 — 동의 항목을 요청하지 않는다. 초대 링크로 왔으면 `invite`에 초대 토큰을 넘긴다(콜백에서 그 가족에 합류).
      security: []
      parameters:
        - { name: invite, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: next, in: query, required: false, schema: { type: string, maxLength: 500, pattern: '^/app(/[^/].*)?$' }, description: '로그인 뒤 돌아갈 보호자 앱 주소(D47 — 로그인 전에 연 이웃 링크 등). 같은 셸 상대 경로만, 없으면 기본 도착지' }
      responses:
        '302': { description: '카카오 인증 화면(https://kauth.kakao.com/oauth/authorize)으로 이동. Set-Cookie uam_kakao_state(10분, HttpOnly, SameSite=Lax)' }
        '503':
          description: 카카오 앱 키 미설정 — code not_saved, reason kakao_not_configured(화면은 버튼을 비활성으로 둔다)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/auth/kakao/callback:
    get:
      tags: [인증]
      summary: 카카오 로그인 콜백 (UC13 §0, R-26) — 항상 웹 화면으로 302
      description: |
        카카오가 돌려보내는 주소(카카오 디벨로퍼스 Redirect URI와 같아야 한다: APP_BASE_URL + /v1/auth/kakao/callback).
        state 대조 → 인가 코드를 토큰으로 → 회원번호 → 계정 찾기(없으면 가족 공간 + 만든 보호자, 초대면 그 가족의 공동 보호자) → 세션 쿠키 uam_sid.
        결과는 이동할 화면으로 알린다 — 처음 `/app/children/new?welcome=1`(캐릭터 만들기, D47) · 다시 옴 `/app`(홈 = 아이 미술관, D47) · 초대 합류 `/app/family?joined=1` ·
        취소 `/app/login?kakao=cancelled` · 실패 `/app/login?kakao=failed` · 초대 무효 `/app/invite?error=<reason>`. 토큰·코드·회원번호는 저장·로그하지 않는다.
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 2000 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 200 }, description: '카카오가 보낸 오류(취소면 access_denied)' }
        - { name: error_description, in: query, required: false, schema: { type: string, maxLength: 1000 } }
      responses:
        '302': { description: 웹 화면으로 이동(위 목록) }
  /v1/auth/signup:
    post:
      tags: [인증]
      summary: 보호자 이메일 가입 (UC13, FR-31, BR-ACC-06~08, G26, D18)
      description: |
        이메일·비밀번호만 받는다. 이메일이 로그인 아이디(별도 아이디 없음). 가족 공간을 함께 만든다.
        응답은 가입 여부와 관계없이 항상 202 — 이미 가입된 이메일(대소문자 무시)이면 계정을 만들지 않고 그 주소로 안내 메일만 보낸다(결정 ④).
        이메일별·IP별 요청 한도를 넘으면 메일을 보내지 않고 응답은 그대로 202 [추론 예시값: 같은 이메일 10분 3회, 같은 IP 1시간 20회].
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, passwordConfirm]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, description: '규칙은 U19. 예시값 8자 이상' }
                passwordConfirm: { type: string }
                inviteToken:
                  type: string
                  description: '공동 보호자 초대 링크로 가입할 때(UC13 A4) — 새 가족 공간을 만들지 않고 초대한 가족에 공동 보호자로 합류하고, 초대 메일 수신이 주소 확인을 겸해 확인 메일을 보내지 않는다. 이메일은 초대받은 이메일과 같아야 한다(다르면 403 invite_email_mismatch). 토큰이 쓸 수 없으면 400 token_invalid. 이미 가입된 이메일이면 초대를 쓰지 않고 E1과 같이 처리한다'
      responses:
        '202': { description: 확인 메일 발송(또는 안내 메일) — 항상 같은 응답 }
        '400': { $ref: '#/components/responses/TokenInvalid' }
        '403':
          description: 초대 링크 가입인데 이메일이 초대받은 이메일과 다름 — code forbidden_role, reason invite_email_mismatch
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/NotSaved' }
  /v1/auth/email/verify:
    post:
      tags: [인증]
      summary: 가입 확인 메일 링크 처리 (UC13 BF5, G27)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: 메일 링크의 1회용 토큰(서버는 해시만 저장) }
      responses:
        '204': { description: '이메일 확인 완료. 가입 끝 — 로그인 세션(`uam_sid`)을 함께 발급한다(UC13 BF5)' }
        '400': { $ref: '#/components/responses/TokenInvalid' }
  /v1/auth/email/verify/resend:
    post:
      tags: [인증]
      summary: 확인 메일 다시 받기 (UC13, G26·G27) — 이전 토큰 무효
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: 항상 같은 응답(가입 여부 비노출) }
  /v1/auth/login:
    post:
      tags: [인증]
      summary: 보호자 로그인 (INC1) — 이메일이 아이디
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '204': { description: 로그인됨. `uam_sid` 쿠키 발급 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 비밀번호는 맞았으나 이메일 확인 전 — code `email_unverified`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/logout:
    post:
      tags: [인증]
      summary: 보호자 로그아웃
      security: [{ guardianSession: [] }]
      responses:
        '204': { description: 로그아웃됨 }
  /v1/auth/recovery:
    post:
      tags: [인증]
      summary: 로그인 정보 찾기 (UC14, FR-32) — 아이디(이메일)와 재설정 링크를 메일로
      description: 가입 여부와 관계없이 같은 문구·같은 202. 이메일 확인 전 계정이면 가입 확인 메일을 다시 보낸다 [추론]. 메일에 가족 정보 없음.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: '"가입된 이메일이면 메일을 보냈어요"' }
  /v1/auth/recovery/reset:
    post:
      tags: [인증]
      summary: 비밀번호 재설정 (UC14, G27, 결정 ⑥) — 성공 시 그 계정의 모든 세션 무효
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, passwordConfirm]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
                passwordConfirm: { type: string }
      responses:
        '204': { description: 재설정됨. password_changed_at 이전 세션은 현재 세션 포함 모두 무효 }
        '400': { $ref: '#/components/responses/TokenInvalid' }
        '422': { description: '새 비밀번호 규칙 위반·확인 불일치 — 토큰은 아직 쓴 것으로 보지 않는다(UC14 E3)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { $ref: '#/components/responses/NotSaved' }
  /v1/auth/password:
    post:
      tags: [인증]
      summary: 로그인한 보호자의 비밀번호 변경 (UC14 A5, D24)
      description: 현재 비밀번호를 확인하고 새 비밀번호(재설정과 같은 규칙)로 바꾼다. password_changed_at 갱신으로 다른 기기의 세션은 모두 무효가 되고, 지금 기기에는 새 세션 쿠키를 준다(로그인 유지). 현재 비밀번호가 틀리면 바꾸지 않고 로그인 실패와 같은 요청 한도를 센다.
      security: [{ guardianSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, password, passwordConfirm]
              properties:
                currentPassword: { type: string }
                password: { type: string, minLength: 8 }
                passwordConfirm: { type: string }
      responses:
        '204': { description: '바뀜. 다른 기기 세션 무효, 이 기기는 새 `uam_sid` 쿠키' }
        '409':
          description: 카카오 계정은 비밀번호가 없다 — code conflict, reason no_password (D36)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { description: '새 비밀번호 규칙 위반·확인 불일치(invalid_fields) 또는 현재 비밀번호 틀림(reason current_password_mismatch)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { description: '현재 비밀번호를 여러 번 틀림(로그인 실패와 같은 한도, reason login_attempts)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { $ref: '#/components/responses/NotSaved' }
  /v1/ops/auth/login:
    post:
      tags: [인증]
      security: []
      summary: 팀원 로그인 (INC2) — 역할은 계정에 고정
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 로그인됨. `uam_ops_sid` 쿠키 발급
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    description: 'SD_03 team_member_role — 한 팀원이 여러 역할을 가질 수 있다(BR-ACC-05)'
                    items: { $ref: '#/components/schemas/StaffRole' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/ops/auth/logout:
    post:
      tags: [인증]
      summary: 팀원 로그아웃 — 현재 운영 세션 삭제 (INC2, D21)
      security: [{ staffSession: [] }]
      responses:
        '204': { description: 로그아웃됨. `uam_ops_sid` 쿠키 삭제. 세션이 없어도 204 }
  /v1/ops/me:
    get:
      tags: [인증]
      summary: 로그인한 팀원 상태 — 역할·가린 계정 (C9 운영 셸, 새로고침 뒤 복원, D21)
      description: 역할 목록으로 SD_02 §2-1 역할별 메뉴 표의 메뉴만 그린다.
      security: [{ staffSession: [operator, evaluator, integrator] }]
      x-permission: staff.me   # D24 — 역할(보안 범위)은 api/src/auth/policy.ts와 같다
      responses:
        '200':
          description: 팀원 상태
          content:
            application/json:
              schema:
                type: object
                required: [roles, emailMasked]
                properties:
                  emailMasked: { type: string }
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/StaffRole' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me:
    get:
      tags: [인증]
      summary: 로그인한 보호자 상태 — 가족 소속·역할 (UC15, U20) [추론]
      description: 화면이 가족 없음 상태(나가거나 해제된 계정)를 알아 "초대 기다리기 / 새 가족 공간 만들기"를 보이는 데 쓴다. 가족 ID는 응답하지 않는다.
      security: [{ guardianSession: [] }]
      responses:
        '200':
          description: 보호자 상태
          content:
            application/json:
              schema:
                type: object
                required: [hasFamily, loginMethod]
                properties:
                  emailMasked: { type: [string, 'null'], description: '카카오 계정은 null(이메일을 받지 않는다, R-26)' }
                  loginMethod: { type: string, enum: [kakao, email], description: '2026-09-30 카카오 로그인(R-26)' }
                  hasFamily: { type: boolean }
                  role: { type: [string, 'null'], enum: [owner, co, null] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/family:
    post:
      tags: [보호자 앱]
      summary: 새 가족 공간 만들기 — 가족 없는 계정만 (U20 P0 기본값) [추론]
      description: 나가거나 해제돼 family_id가 NULL인 계정이 새 가족 공간을 만들고 만든 보호자(role='owner')가 된다. 이미 가족이 있으면 409.
      security: [{ guardianSession: [] }]
      responses:
        '201': { description: 가족 공간 생성 }
        '409':
          description: 이미 가족에 소속 — code conflict, reason already_in_family
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/family/invites:
    get:
      tags: [보호자 앱]
      summary: 대기 중인 공동 보호자 초대 목록 (UC15, BR-ACC-09) — 초대 번호·마스킹한 이메일·만료 시각
      security: [{ guardianSession: [] }]
      responses:
        '200':
          description: 대기 중 초대
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    emailMasked: { type: [string, 'null'], description: '링크 초대는 null' }
                    expiresAt: { type: string, format: date-time }
    post:
      tags: [보호자 앱]
      summary: 공동 보호자 초대 — 기본은 초대 링크 만들기(UC15 §0, 2026-09-30), 이메일을 주면 기존 초대 메일(메일이 꺼져 있으면 발송 안 함) — 만든 보호자만
      description: |
        **2026-09-30 초대 링크(UC15 §0, R-26)**: 본문을 비우면(`{}`) 이메일 없는 초대를 만들고 201로 한 번 쓰는 링크를 돌려준다 — 화면이 복사해 카카오톡으로 보낸다. 링크 원문은 이 응답에만 있고 DB에는 해시만.
        보호자는 부모 두 명까지(만든 보호자 1 + 공동 보호자 1, 1c460b0 사용자 결정). 초대는 만든 보호자만 — 공동 보호자는 403.
        공동 보호자가 이미 있으면 409 `co_guardian_full`("보호자는 두 명까지예요"). 대기 초대는 가족당 1건 — 새로 초대하면 이전 초대는 무효 [추론].
        초대 유효 7일 [예시값]. 요청 한도 초과 시 메일을 보내지 않고 응답은 그대로 202 [추론]. 초대받은 이메일의 가입 여부는 드러내지 않는다.
      security: [{ guardianSession: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, description: '주면 기존 이메일 초대(메일 발송 설정이 켜져 있을 때만 나간다). 없으면 링크 초대' }
            example: {}
      responses:
        '201':
          description: 초대 링크를 만듦(이메일 없는 초대)
          content:
            application/json:
              schema:
                type: object
                required: [id, link, expiresAt]
                properties:
                  id: { type: string }
                  link: { type: string, description: '한 번 쓰는 초대 링크(APP_BASE_URL/app/invite?token=…). 이 응답에서만 보인다' }
                  expiresAt: { type: string, format: date-time }
        '202': { description: 초대 메일 발송(가입 여부 비노출) — 이메일을 준 경우 }
        '403':
          description: 공동 보호자는 초대할 수 없음 — code forbidden_role, reason invite_owner_only (G29)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 보호자 두 명이 이미 참 — code conflict, reason co_guardian_full (G29, UC15 E9)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/family/invites/{inviteId}:
    delete:
      tags: [보호자 앱]
      summary: 초대 취소 (UC15)
      security: [{ guardianSession: [] }]
      parameters:
        - { name: inviteId, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]{0,17}$' } }
      responses:
        '204': { description: 취소됨 }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/family/invites/lookup:
    get:
      tags: [보호자 앱]
      summary: 초대 링크의 초대 이메일 — 가입 화면(S0) 미리 채움용 (UC15 A4·UC13 A4, SD_02 S1c)
      description: |
        초대 메일 링크의 토큰으로 초대받은 이메일을 돌려준다. 토큰을 쓰지 않는다(수락은 가입·수락 요청에서). 로그인 없이 부른다.
        토큰은 초대받은 이메일로만 보낸 1회용 비밀값이라, 토큰을 가진 사람에게 그 이메일을 보여도 새로 드러나는 정보가 없다.
        만료·사용·취소를 구분하지 않고 400 `token_invalid`(G28, BR-ACC-08). 가족 정보·초대한 사람은 싣지 않는다.
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: 초대 이메일(원문)
          content:
            application/json:
              schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
        '400': { $ref: '#/components/responses/TokenInvalid' }
  /v1/family/invites/accept:
    post:
      tags: [보호자 앱]
      summary: 초대 수락 (UC15, G28) — 토큰 유효·이메일 일치·다른 가족 미소속
      description: 로그인한 계정의 이메일이 초대 이메일과 같아야 한다. 초대 링크로 새로 가입한 계정은 새 가족 공간 없이 합류(UC13 A4).
      security: [{ guardianSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: 공동 보호자로 합류 }
        '400': { $ref: '#/components/responses/TokenInvalid' }
        '403':
          description: 로그인한 계정의 이메일이 초대받은 이메일과 다름 — code forbidden_role, reason invite_email_mismatch (G28, UC15 E2, SD_02 S1c). 초대받은 이메일로 로그인하라는 안내용. 링크 초대(이메일 없음)는 대조하지 않는다(2026-09-30)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 이미 다른 가족에 소속 — code conflict, reason already_in_family
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/family/members:
    get:
      tags: [보호자 앱]
      summary: 가족 보호자 목록 (UC15) — 역할(owner/co)과 마스킹한 이메일
      security: [{ guardianSession: [] }]
      responses:
        '200':
          description: 보호자 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    role: { type: string, enum: [owner, co] }
                    emailMasked: { type: [string, 'null'], description: '카카오 계정은 null(D36)' }
                    isMe: { type: boolean }
  /v1/family/members/{memberId}:
    delete:
      tags: [보호자 앱]
      summary: 공동 보호자 해제 (UC15, G29) — 만든 보호자만. 해제된 계정의 세션은 즉시 모두 삭제
      security: [{ guardianSession: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]{0,17}$' } }
      responses:
        '204': { description: 해제됨. 그 보호자가 올린 자료는 가족 공간에 남음 }
        '403':
          description: 만든 보호자가 아님 — code forbidden_role, reason not_family_owner
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/family/leave:
    post:
      tags: [보호자 앱]
      summary: 가족 공간에서 나가기 (UC15, G29) — 공동 보호자만. 그 계정의 세션은 즉시 모두 삭제
      security: [{ guardianSession: [] }]
      responses:
        '204': { description: 나감. 올린 자료는 가족 공간에 남음 }
        '409':
          description: 만든 보호자는 나갈 수 없음 — code conflict, reason family_owner_cannot_leave (U20)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/town:
    get:
      tags: [보호자 앱]
      summary: 미술관 마을 (D40, SD_02 §17-13 D) — 내 건물 · 이웃 건물(문 열림, 아이 캐릭터·별칭) · 모르는 가족 건물(겉모양만, 문 잠김)
      description: |
        가족(계정)마다 건물 1채. 건물 자리(x, y)는 가족 번호로 정해진 격자. 모르는 가족은 최대 12채, 이름·아이 정보 없이 모양만(BR-ACC-01 — 존재 외에는 드러내지 않는다).
        건물 id는 가족 번호가 아니라 서명한 불투명 값이다.
      security: [{ guardianSession: [] }]
      responses:
        '200':
          description: 마을
          content:
            application/json:
              schema:
                type: object
                required: [buildings]
                properties:
                  buildings:
                    type: array
                    items: { $ref: '#/components/schemas/TownBuilding' }
  /v1/neighbors:
    get:
      tags: [보호자 앱]
      summary: 이웃 가족 목록 (D40, UC_16) — 건물 id · 아이 캐릭터·별칭
      security: [{ guardianSession: [] }]
      responses:
        '200':
          description: 이웃
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TownBuilding' }
  /v1/neighbors/{buildingId}:
    delete:
      tags: [보호자 앱]
      summary: 이웃 끊기 (D40, UC_16 A2) — 어느 쪽이든 바로, 끊으면 서로의 미술관 문이 즉시 잠김
      security: [{ guardianSession: [] }]
      parameters:
        - { name: buildingId, in: path, required: true, schema: { type: string, pattern: '^b_[A-Za-z0-9_-]{16}$' } }
      responses:
        '204': { description: 끊음 }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/neighbors/invites:
    get:
      tags: [보호자 앱]
      summary: 대기 중인 이웃 초대 링크 (D40)
      security: [{ guardianSession: [] }]
      responses:
        '200':
          description: 대기 중(가족당 1건)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, expiresAt]
                  properties:
                    id: { type: string }
                    expiresAt: { type: string, format: date-time }
    post:
      tags: [보호자 앱]
      summary: 이웃 초대 링크 만들기 (D40, UC_16 BF1) — 한 번 · 7일 · 가족당 대기 1건(새로 만들면 이전 링크 무효), 링크 원문은 이 응답에서만
      security: [{ guardianSession: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: {} }
            example: {}
      responses:
        '201':
          description: 링크
          content:
            application/json:
              schema:
                type: object
                required: [id, link, expiresAt]
                properties:
                  id: { type: string }
                  link: { type: string, description: 'APP_BASE_URL/app/neighbor?token=…' }
                  expiresAt: { type: string, format: date-time }
        '409':
          description: 이웃이 이미 30가족 — code conflict, reason neighbor_full
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/neighbors/invites/{inviteId}:
    delete:
      tags: [보호자 앱]
      summary: 대기 중인 이웃 초대 취소 (D40)
      security: [{ guardianSession: [] }]
      parameters:
        - { name: inviteId, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]{0,17}$' } }
      responses:
        '204': { description: 취소 }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/neighbors/accept:
    post:
      tags: [보호자 앱]
      summary: 이웃 초대 받기 (D40, UC_16 BF3) — 두 가족이 서로 이웃
      security: [{ guardianSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '204': { description: 이웃이 됨(이미 이웃이어도 204) }
        '400': { $ref: '#/components/responses/TokenInvalid' }
        '409':
          description: 자기 가족의 링크 — reason own_family · 이웃 30가족 — reason neighbor_full
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/visit/children/{childId}/gallery:
    get:
      tags: [보호자 앱]
      summary: 이웃 아이의 미술관 보기 (D40, UC_16 BF4, SD_02 §17-13 F) — 그림 · 별칭 · 제목 · 캐릭터만
      description: 이웃이 아니면 404(존재를 숨김). 나이 · 한마디 · 감상평 · 그린 날 · 원본은 싣지 않는다. 방은 번호로만("전시실 1"). 파일은 방문 전용 경로(/v1/visit/files)로만.
      security: [{ guardianSession: [] }]
      parameters:
        - { name: childId, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]{0,17}$' } }
      responses:
        '200':
          description: 방문 미술관
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitGallery' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/visit/files/{token}:
    get:
      tags: [보호자 앱]
      summary: 방문 전용 그림 파일 (D40) — 받을 때마다 이웃 관계를 다시 확인, 끊으면 바로 404
      security: [{ guardianSession: [] }]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, maxLength: 300 } }
      responses:
        '200': { description: 그림 파일 }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/children:
    get:
      tags: [보호자 앱]
      summary: 아이 목록 (UC1, S1)
      security: [{ guardianSession: [] }]
      responses:
        '200':
          description: 가족의 아이 별칭 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Child' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [보호자 앱]
      summary: 아이 등록 — 별칭만 (UC1, FR-1, BR-CHD-01·02 v2.2, G4) — 별칭 중복 검사 없음(D18)
      security: [{ guardianSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example: {"alias": "하늘"}   # = ops/checklist/examples(점검표 E3, 시험 contract-docs가 대조)
            schema: { $ref: '#/components/schemas/ChildInput' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Child' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/NotSaved' }
  /v1/children/{childId}:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    patch:
      tags: [보호자 앱]
      summary: 별칭 수정 (D13)
      security: [{ guardianSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChildInput' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Child' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [보호자 앱]
      summary: 아이 삭제 — 그 아이의 모든 작품 포함 (UC7, FR-10, BR-DEL-01, G18)
      security: [{ guardianSession: [] }]
      responses:
        '202': { description: 삭제 접수. 목록·전시에서 즉시 사라짐 }
        '404': { $ref: '#/components/responses/NotFound' }
