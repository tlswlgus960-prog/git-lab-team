  /v1/children/{childId}/deletion:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    get:
      tags: [보호자 앱]
      summary: 아이 삭제 진행 (S9, UC7, D21) — 폴링용
      security: [{ guardianSession: [] }]
      responses:
        '200':
          description: 진행 상태. 없는 번호·다른 가족 번호·끝난 삭제는 모두 `done`(존재 비노출)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionProgress' }

  /v1/artworks:
    get:
      tags: [보호자 앱]
      summary: 작품 목록과 상태 (UC3, S4, D13) — `삭제 중` 제외
      security: [{ guardianSession: [] }]
      parameters:
        - name: child
          in: query
          schema: { type: string, pattern: '^[1-9][0-9]{0,17}$' }
      responses:
        '200':
          description: 작품 요약 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ArtworkSummary' }
    post:
      tags: [보호자 앱]
      summary: 작품 사진 내구 접수 (UC2, FR-2, BR-INT-01~04, G5·G6)
      description: |
        원본·작품 기록·작업 기록이 모두 저장된 뒤에만 202. 같은 Idempotency-Key 재전송은 기존 작품을 202로 돌려준다.
        형식 JPEG·PNG·HEIC(매직 바이트 판별), 20MB 이하.
      security: [{ guardianSession: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 클라이언트가 만든 UUID → artwork.request_no (uq_artwork_request, BR-INT-03)
          schema: { type: string, format: uuid, maxLength: 64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [childId, photo]
              properties:
                childId: { type: string }
                photo: { type: string, format: binary }
                making: { type: string, enum: ['true', 'false', '1', '0'], description: '(D46) 만들기(입체 작품)면 true — 올릴 때만 고른다, 기본 그림. 미술관 받침대(D45)' }
                title: { type: string, maxLength: 100, description: '(D46) 제목 — 올린 뒤 고칠 수 없다. 비우면 "제목 없는 그림 N"' }
                madeOn: { type: string, format: date, description: '(D46) 그린 날 — 비우면 capturedOn, 없으면 올린 날. 미래는 422 made_on_in_future' }
                ageAtMaking: { type: string, pattern: '^(1[0-8]|[0-9])$', description: '(D46) 그때 나이 0~18 — 비우면 그 아이의 최근 기록' }
                childWords: { type: string, maxLength: 2000, description: '(D46) 아이의 한마디 — 입력 그대로' }
                guardianNote: { type: string, maxLength: 1000, description: '(D46) 보호자 감상평 — 올린 뒤의 느낌은 댓글로' }
                capturedOn:
                  type: string
                  format: date
                  description: '(D34) 사진 촬영일 — 브라우저가 EXIF DateTimeOriginal에서 날짜만 읽어 보낸다(위치·기기 정보는 보내지 않음). 그린 날로 쓴다. 없으면 올린 날, 미래면 오늘. 형식이 틀리면 422 captured_on'
                retakeOf:
                  type: string
                  description: 다시 찍기(EXT2)로 올릴 때 이전 작품 ID. 아이 미리 선택용 참고값
      responses:
        '202':
          description: '접수 완료. D34 — 같은 트랜잭션에서 원본 액자로 **바로 전시**된다(`exhibited: true`, `state: exhibited`, `hungResultKind: frame`). 이야기는 자동으로 채운다(제목 "제목 없는 그림 N"·그린 날·최근 나이). 판정(권유용)은 그대로 돈다'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtworkDetail' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/NotSaved' }

  /v1/artworks/{artworkId}:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
    get:
      tags: [보호자 앱]
      summary: 작품 상세 — 상태·제안 문구 코드·단계별 진행·낮춤 표시 (UC2·3·4, S3·S4·S5)
      security: [{ guardianSession: [] }]
      responses:
        '200':
          description: 작품 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtworkDetail' }
