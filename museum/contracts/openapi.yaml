      summary: 작품 삭제 (UC7, FR-10, G18·G19)
      security: [{ guardianSession: [] }]
      responses:
        '202': { description: 삭제 접수(`deleting`). 진행 중 단계 작업 취소 요청됨 }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/NotSaved' }
  /v1/artworks/{artworkId}/deletion:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
    get:
      tags: [보호자 앱]
      summary: 작품 삭제 진행 (S9, UC7, G19, D21) — 폴링용
      security: [{ guardianSession: [] }]
      responses:
        '200':
          description: 진행 상태. 없는 번호·다른 가족 번호·끝난 삭제(삭제 미완료 포함)는 모두 `done`(존재 비노출, 미완료는 S10에만 집계)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionProgress' }

  /v1/artworks/{artworkId}/confirm:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
    post:
      tags: [보호자 앱]
      summary: 전시 방식 확정 (UC2, FR-3, BR-INT-05, BR-SUG-03·05, G8·G17)
      description: |
        `received`·`judging`·`awaiting_confirm`에서만 받는다. 같은 값 재요청은 현재 상태를 200으로 돌려준다(첫 값 유지).
        `sculpture`는 `sculpture.exposed=true`일 때만(D10). `frame`은 모델을 부르지 않고 즉시 결과를 만든다(BR-PRC-01).
      security: [{ guardianSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { $ref: '#/components/schemas/ConfirmKind' }
      responses:
        '200':
          description: 확정됨(또는 이미 같은 값으로 확정됨)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtworkDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/artworks/{artworkId}/decision:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
    post:
      tags: [보호자 앱]
      summary: 결과 확인 결정 (UC4, FR-6, BR-APR-02·04·06, D2·D11, G10)
      description: |
        회차당 1회(uq). 중복 요청은 첫 결정을 200으로 돌려준다.
        `failed`(처리하지 못함)에서는 `frame`(원본 읽기 가능 시)·`retake`만(트리거 trg_decision_bi, G9). 회차는 최대 2(2회차에 use_lower 없음).
        `use_lower`는 보여 준 결과보다 낮은 결과가 체인에 있을 때만(2.5D가 없으면 생성 후 다시 `awaiting_review`).
        `retake`는 이 작품을 `deleting`으로 두고, 응답의 `retake.childId`로 새 접수를 시작한다(EXT2).
      security: [{ guardianSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example: {"decision": "like"}   # = ops/checklist/examples(점검표 E3, 시험 contract-docs가 대조)
            schema:
              type: object
              required: [decision]
              properties:
                decision: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: 결정 반영(또는 이미 반영된 결정)
          content:
            application/json:
              schema:
                type: object
                required: [artwork, alreadyDecided]
                properties:
                  artwork:
                    description: '결정 뒤 작품. `retake`면 작품이 `deleting`이 되어 보호자에게 보이지 않으므로 null(EXT2) — 화면은 `retake.childId`로 새 접수'
                    oneOf:
                      - { $ref: '#/components/schemas/ArtworkDetail' }
                      - { type: 'null' }
                  alreadyDecided: { type: boolean }
                  retake:
                    type: object
                    properties:
                      childId: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/artworks/{artworkId}/story:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
    put:
      tags: [보호자 앱]
      summary: 이야기 기록 (UC5, FR-7, BR-STY-01~03, G11·G12)
      description: |
        **D46: 한 번 올라간 작품은 고치지 않는다 — 이 요청은 늘 409 `artwork_locked`**(바꾸려면 지우고 다시 올린다). 아래는 D46 전의 설명.
        부분 저장 허용. 승인됨 + 필수 3항목이 채워지면 `exhibited`로 전환. 보호자 감상평(`guardianNote`, D25)은 선택이고 전시 조건이 아니다.
        `exhibited` 작품의 필수 항목을 비우는 요청은 422. `childWords`는 받은 그대로 저장한다(트림·교정 없음).
        공동 보호자 동시 수정: `baseUpdatedAt`이 저장된 `updatedAt`과 다르면 저장하지 않고 409 `story_conflict`("다른 보호자가 먼저 고쳤어요") — 화면은 최신 이야기를 다시 불러온다.
      security: [{ guardianSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example: {"title": "우리 가족", "madeOn": "2026-09-20", "ageAtMaking": 5, "childWords": "엄마랑 바다 갔어"}   # = ops/checklist/examples(점검표 E3, 시험 contract-docs가 대조)
            schema: { $ref: '#/components/schemas/StoryInput' }
      responses:
        '200':
          description: 저장됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtworkDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/artworks/{artworkId}/comments:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
    get:
      tags: [보호자 앱]
      summary: 부모 댓글 목록 (D46 ④)
      description: 가족 보호자(공동 보호자 포함)만. 가족 밖(이웃 방문)에는 없다. 오래된 것부터. **기한**(이제민 결정) — 걸린 날부터 7일 동안만 쓰고 지운다(`open`), 그 뒤로는 보기만.
      security: [{ guardianSession: [] }]
      responses:
        '200':
          description: 댓글과 기한
          content:
            application/json:
              schema:
                type: object
                required: [items, open, openUntil, days]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ArtworkComment' } }
                  open: { type: boolean, description: '지금 쓰고 지울 수 있음' }
                  openUntil: { type: string, format: date-time, description: '걸린 때(없으면 올린 때) + 7일' }
                  days: { type: integer, description: '기한 일수(7)' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [보호자 앱]
      summary: 부모 댓글 남기기 (D46 ④)
      description: 500자, 입력 그대로(트림 · 교정 없음). 빈칸은 422 comment_blank. 기한(7일)이 지나면 409 comments_closed.
      security: [{ guardianSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], additionalProperties: false, properties: { body: { type: string, maxLength: 500 } } }
      responses:
        '201':
          description: 남김
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtworkComment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/artworks/{artworkId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
      - { name: commentId, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]{0,17}$' } }
    delete:
      tags: [보호자 앱]
      summary: 내 댓글 지우기 (D46 ④)
      description: 자기 댓글만. 남의 댓글은 403 forbidden_role(not_your_comment). 기한(7일)이 지나면 409 comments_closed.
      security: [{ guardianSession: [] }]
      responses:
        '204': { description: 지움 }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/artworks/{artworkId}/captions:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
    post:
      tags: [보호자 앱]
      summary: (P0.5) 설명 초안 생성·재생성 (UC10, FR-27, BR-CAP-01~07, G13~G16)
      description: |
        P0에서는 `caption.enabled=false`라 404. 승인본이 있으면 409 `caption_locked` "승인한 설명은 바뀌지 않아요"(E3).
        LLM 소진 시 503 `llm_unavailable` + 선택지(template / later / direct)(D1, G15).
        그 밖의 거절: 키워드·고른 태그 모두 없음 422 `keywords_required`(G14, E6) · 고른 태그가 그 작품의 M2 후보가 아님 422 `tag_not_candidate`(BR-CAP-06) ·
        M6 활성 버전 없음(라이선스 미확인 포함) 409 `model_disabled`(G13, E4 — 템플릿·직접 입력만) · 삭제 중 409 `deleting`(E7).
        `fallback`: `template` = LLM을 부르지 않고 app-api가 템플릿 문장을 만든다(인프라 소진 뒤 보호자 선택이라 설명 낮춤률에 넣지 않음, E1) ·
        `direct` = `body`의 보호자 문장을 출처 direct로 저장(A3, "AI 작성" 표시 없음). 새 초안은 이전 미승인 초안을 폐기로 바꾼다(A1).
      security: [{ guardianSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptionRequest' }
      responses:
        '201':
          description: 규칙 검사를 통과한 초안(또는 템플릿)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Caption' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/NotSaved' }
  /v1/artworks/{artworkId}/captions/{captionId}:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
      - name: captionId
        in: path
        required: true
        schema: { type: string, pattern: '^[1-9][0-9]{0,17}$' }
    put:
      tags: [보호자 앱]
      summary: (P0.5) 설명 수정·승인·폐기 (UC10, BR-CAP-04, D6)
      security: [{ guardianSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [edit, approve, discard] }
                body: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Caption' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/captions/model-status:
    get:
      tags: [보호자 앱]
      summary: (P0.5) 설명 모델 대기 요약 — S7 안내 문구용 (SD_02 e6c464c, A 모델적재 §3.1)
      description: |
        llm-server `/v1/ready`의 `model.state`·`maxObservedLoadSeconds`·`queue.waiting`을 요약만 한다. 모델 이름·버전·원래 상태값은 싣지 않는다(BR-SUG-02, D3).
        `warming` = state가 cold 또는 loading(짐작 포함) → "처음 만들 때는 조금 더 걸릴 수 있어요(최대 약 N초)".
        `busy` = queue.waiting > 0 → "다른 설명을 먼저 만들고 있어요". P0(`CAPTION_ENABLED=false`)에서는 404.
      security: [{ guardianSession: [] }]
      responses:
        '200':
          description: 대기 요약
          content:
            application/json:
              schema:
                type: object
                required: [warming, busy]
                properties:
                  warming: { type: boolean }
                  maxWaitSeconds: { type: [number, 'null'], description: 'maxObservedLoadSeconds(없으면 null — "최대 약 N초"를 빼고 보인다)' }
                  busy: { type: boolean }
