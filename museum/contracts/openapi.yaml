  /v1/ops/models/{modelId}/check:
    post:
      tags: [운영]
      summary: 모델 점검 요청 (D20, FR-33, UC8 A8·UC9 A7, G30) — 평가 묶음 항목 한 장으로 샘플 추론
      description: |
        모델 하나를 평가 묶음 항목 한 장으로 돌려 동작(오류 없음·출력 형식·처리 시간)만 확인한다. 품질 점수 없음, 재시도 없음(BR-OPS-06).
        `versionId`가 없으면 활성 버전, 없으면 가장 최근의 폐기 아닌 버전. 라이선스 확인 전·후보 버전도 점검한다(활성화가 아님).
        `evalItemId`가 없으면 서버가 고른다(M3는 사람 항목 우선, M7은 입체 항목, 그 밖은 사진 항목).
        점검 작업은 `stage_job` `origin='check'`·우선순위 30으로 들어가고 지표·결과 미도달에 넣지 않는다(BR-OPS-05). gate_event는 G30 거절만.
        serving 점검 실행기가 배포되기 전(app-api `MODEL_CHECK_ENABLED` 꺼짐)에는 503 `not_saved`/`check_runner_missing`.
      security: [{ staffSession: [operator, evaluator] }]
      x-permission: models.check   # D24 — 역할(보안 범위)은 api/src/auth/policy.ts와 같다
      parameters:
        - { name: modelId, in: path, required: true, schema: { type: string, enum: [M1, M2, M3, M4, M5, M6, M7] } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                versionId: { type: string, pattern: '^[0-9]+$' }
                evalItemId: { type: string, pattern: '^[0-9]+$' }
      responses:
        '202':
          description: 점검 접수(status queued). 결과는 /v1/ops/model-checks/{checkId}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCheck' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
        '404': { description: '없는 버전(그 모델의 것이 아님 포함)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409':
          description: |
            conflict — reason `check_in_progress`(같은 모델 점검 진행 중) · `rule_not_checked`(M4) · `m6_check_p05`(M6, P0.5 전) ·
            `no_version`(버전 없음) · `version_retired`(G30) · `no_check_sample`(맞는 평가 묶음 항목 없음, G30)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: validation_failed — reason `not_check_sample`(평가 묶음 항목이 아니거나 모델에 맞지 않는 종류, G30)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: not_saved — reason `check_runner_missing`(serving 점검 실행기 배포 전)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
